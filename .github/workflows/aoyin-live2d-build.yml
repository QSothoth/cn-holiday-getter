name: Build Ao Yin Live2D desktop pet

on:
  workflow_dispatch:
  push:
    branches: [agent/aoyin-live2d]
    paths:
      - 'aoyin-desktop-pet/**'
      - '.github/workflows/aoyin-live2d-build.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: windows-x64
            args: ''
          - platform: macos-14
            label: macos-universal
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: aoyin-desktop-pet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aoyin-desktop-pet/requirements-assets.txt

      - name: Generate licensed local assets
        shell: bash
        run: |
          python -m pip install -r requirements-assets.txt
          python scripts/bootstrap_assets.py
          python scripts/validate_project.py

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: runner.os == 'macOS'
        shell: bash
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build application
        shell: bash
        run: cargo tauri build ${{ matrix.args }}

      - name: Upload install bundles
        uses: actions/upload-artifact@v4
        with:
          name: aoyin-desktop-pet-${{ matrix.label }}
          path: |
            aoyin-desktop-pet/src-tauri/target/**/release/bundle/**/*.dmg
            aoyin-desktop-pet/src-tauri/target/**/release/bundle/**/*.app.tar.gz
            aoyin-desktop-pet/src-tauri/target/**/release/bundle/**/*.msi
            aoyin-desktop-pet/src-tauri/target/**/release/bundle/**/*.exe
          if-no-files-found: error
          retention-days: 14
