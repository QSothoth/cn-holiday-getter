[package]
name = "aoyin-desktop-pet"
version = "0.2.0"
description = "Ao Yin fan-made Live2D desktop pet"
authors = ["QSothoth"]
edition = "2021"
license = "MIT"

[lib]
name = "aoyin_desktop_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
